<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00bcd4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="512" height="512" fill="#0f0f1a" rx="80"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="140" fill="url(#glow)" filter="url(#blur)" opacity="0.6"/>
  
  <!-- Main circle -->
  <circle cx="256" cy="256" r="90" fill="#00bcd4"/>
  
  <!-- Inner highlight -->
  <circle cx="240" cy="240" r="30" fill="#4dd0e1" opacity="0.5"/>
</svg>
