<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Schwilo :: Visual Core V2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
        #status {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #00ffff;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.6;
            pointer-events: none;
            text-shadow: 0 0 5px #00ffff;
        }
    </style>
</head>
<body>
    <div id="status">SCHWILO // CORE: ACTIVE // VISUAL: CAT_MODE_V2</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CENA ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.003); // Fog preto profundo

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;
        camera.position.y = 0.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Otimização para R69
        document.body.appendChild(renderer.domElement);

        // --- GEOMETRIA DO GATO ---
        
        // Função auxiliar para criar partículas
        function createParticleSystem(count, colorScale, sizeScale, distributionFn) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const basePos = []; // Guardar posição original para animação

            const color1 = new THREE.Color(0x00aaff); // Azul Cyber
            const color2 = new THREE.Color(0xaa00ff); // Roxo Neon

            for (let i = 0; i < count; i++) {
                const p = distributionFn(i);
                positions.push(p.x, p.y, p.z);
                basePos.push(p.x, p.y, p.z);

                // Cor baseada na profundidade ou altura
                const mixedColor = color1.clone().lerp(color2, (p.y + 1) / 3);
                colors.push(mixedColor.r * colorScale, mixedColor.g * colorScale, mixedColor.b * colorScale);
                
                sizes.push(Math.random() * sizeScale);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('basePos', new THREE.Float32BufferAttribute(basePos, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            return new THREE.Points(geometry, material);
        }

        // 1. Cabeça (Esfera Achatada e Larga)
        const head = createParticleSystem(3500, 1.0, 0.06, (i) => {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 2 + Math.random() * 0.1; // Raio base + ruído

            let x = r * Math.sin(phi) * Math.cos(theta);
            let y = r * Math.sin(phi) * Math.sin(theta);
            let z = r * Math.cos(phi);

            // Deformação para formato de cabeça de gato
            x *= 1.2; // Mais largo (bochechas)
            y *= 0.9; // Um pouco achatado
            
            // Queixo
            if (y < -0.5) {
                x *= 0.85;
                z *= 0.9;
            }

            return { x, y, z };
        });
        scene.add(head);

        // 2. Orelhas (Cones no topo)
        const ears = createParticleSystem(800, 1.2, 0.05, (i) => {
            // Decide se é orelha esquerda ou direita
            const side = Math.random() > 0.5 ? 1 : -1;
            
            // Lógica de cone
            const h = Math.random(); // Altura (0 a 1)
            const r = (1 - h) * 0.8; // Raio diminui conforme sobe
            const theta = Math.random() * Math.PI * 2;

            let x = r * Math.cos(theta);
            let y = h * 1.5; // Altura da orelha
            let z = r * Math.sin(theta) * 0.5; // Mais finas profundidade

            // Posicionar na cabeça
            x += side * 1.2; // Afastar do centro
            y += 1.0;        // Subir
            z -= 0.2;        // Levemente para trás

            // Inclinação da orelha
            const tilt = 0.3 * side;
            const x_rot = x * Math.cos(tilt) - y * Math.sin(tilt);
            const y_rot = x * Math.sin(tilt) + y * Math.cos(tilt);
            
            return { x: x_rot, y: y_rot, z };
        });
        scene.add(ears);

        // 3. Olhos (Clusters Brilhantes)
        const eyes = createParticleSystem(300, 5.0, 0.08, (i) => {
            const side = Math.random() > 0.5 ? 1 : -1;
            const theta = Math.random() * Math.PI * 2;
            const r = Math.random() * 0.3; // Tamanho do olho

            // Olhos amendoados
            let x = r * Math.cos(theta) * 1.5; 
            let y = r * Math.sin(theta);
            let z = 0;

            // Posição
            x += side * 0.8;
            y += 0.2;
            z += 1.8; // Para frente

            // Leve inclinação "badass"
            const tilt = -0.2 * side;
            const x_final = x * Math.cos(tilt) - y * Math.sin(tilt);
            const y_final = x * Math.sin(tilt) + y * Math.cos(tilt);

            return { x: x_final, y: y_final, z };
        });
        scene.add(eyes);

        // 4. Bigodes (Linhas)
        const whiskers = createParticleSystem(200, 2.0, 0.04, (i) => {
            const side = Math.random() > 0.5 ? 1 : -1;
            // 3 linhas de bigode por lado
            const row = Math.floor(Math.random() * 3); 
            
            const t = Math.random(); // progresso da linha
            const length = 1.5;

            let x = t * length;
            let y = (Math.random() - 0.5) * 0.05; // Ruído na linha
            let z = (Math.random() - 0.5) * 0.05;

            // Espalhar linhas (leque)
            const angle = (row - 1) * 0.2; // -0.2, 0, 0.2 radianos
            
            let x_rot = x * Math.cos(angle) - y * Math.sin(angle);
            let y_rot = x * Math.sin(angle) + y * Math.cos(angle);

            // Posicionar no focinho
            x_rot += 0.5; // Começa um pouco fora do centro
            
            // Espelhar e posicionar
            x_rot *= side;
            y_rot -= 0.5; // Altura do nariz
            z += 1.8;

            return { x: x_rot, y: y_rot, z };
        });
        scene.add(whiskers);


        // --- ANIMAÇÃO ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Grupo global (cabeça inteira se mexe)
            const groupRotationY = Math.sin(time * 0.3) * 0.15;
            const groupRotationX = Math.sin(time * 0.5) * 0.05;

            [head, ears, eyes, whiskers].forEach(mesh => {
                mesh.rotation.y = groupRotationY;
                mesh.rotation.x = groupRotationX;

                // Animação de "Dados Vivos" (partículas flutuando)
                const positions = mesh.geometry.attributes.position.array;
                const basePos = mesh.geometry.attributes.basePos.array;
                const count = positions.length / 3;

                for(let i=0; i<count; i++) {
                    const idx = i * 3;
                    
                    // Ruído suave
                    const noiseX = Math.sin(time * 2 + basePos[idx+1]) * 0.02;
                    const noiseY = Math.cos(time * 1.5 + basePos[idx]) * 0.02;
                    
                    // Simulação de fala (pulso na parte de baixo da cabeça)
                    let speechMod = 0;
                    if (mesh === head && basePos[idx+1] < -0.5) {
                        speechMod = Math.sin(time * 10) * 0.05 * (1 - Math.abs(basePos[idx])); // Só o queixo mexe rápido
                    }

                    positions[idx] = basePos[idx] + noiseX;
                    positions[idx+1] = basePos[idx+1] + noiseY + speechMod;
                    positions[idx+2] = basePos[idx+2];
                }
                mesh.geometry.attributes.position.needsUpdate = true;
            });

            // Olhos piscam ou brilham
            const blink = Math.sin(time * 0.5);
            eyes.material.opacity = 0.5 + (blink * 0.2);

            renderer.render(scene, camera);
        }

        // Responsividade
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
