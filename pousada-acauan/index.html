    <meta name="description" content="Hospedagem exclusiva a 300 metros da praia na Guarda do Embaú, SC. Conforto, natureza e design orgânico." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
      
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px; /* Revertido para cabeçalho padrão */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #FDFBF7; /* Light Sand */
        color: #3E3E3E; /* Soft Charcoal */
        -webkit-font-smoothing: antialiased;
      }
      
      h1, h2, h3, h4, .font-serif {
        font-family: 'Playfair Display', serif;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in-up {
        animation: fade-in-up 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      }
      
      ::selection {
        background-color: #7895B2;
        color: white;
      }

      /* Estilo customizado para o logo Acauan */
      .acauan-logo-text {
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
