<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Schwilo :: Visual Core V3</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020202; }
        canvas { display: block; }
        #status {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #00ffff;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            opacity: 0.5;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="status">Schwilo v3.0 // Morphology: Felis Catus // Rendering...</div>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CENA ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020202, 0.0025);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 8;
        camera.position.y = 0;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Grupo principal que segura a cabeça inteira
        const catGroup = new THREE.Group();
        scene.add(catGroup);

        // --- FERRAMENTA DE CRIAÇÃO ---
        function addCluster(count, colorHex, sizeBase, spreadFn) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const basePos = []; 

            const targetColor = new THREE.Color(colorHex);

            for (let i = 0; i < count; i++) {
                const p = spreadFn(i);
                positions.push(p.x, p.y, p.z);
                basePos.push(p.x, p.y, p.z);

                // Variação sutil na cor
                const c = targetColor.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.2);
                colors.push(c.r, c.g, c.b);
                sizes.push(Math.random() * sizeBase);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('basePos', new THREE.Float32BufferAttribute(basePos, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            const mesh = new THREE.Points(geometry, material);
            catGroup.add(mesh);
            return mesh;
        }

        // --- MODELAGEM (ESCULTURA DE PONTOS) ---

        // 1. Crânio Principal (Testa e Fundo)
        const skull = addCluster(3000, 0x0088ff, 0.08, () => {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 2.2;
            
            let x = r * Math.sin(phi) * Math.cos(theta);
            let y = r * Math.sin(phi) * Math.sin(theta);
            let z = r * Math.cos(phi);

            // Achatar e alargar
            x *= 1.1; 
            y *= 0.9;
            z *= 0.9;

            return {x, y, z};
        });

        // 2. Bochechas (Para dar largura e fofura)
        const cheeks = addCluster(2000, 0x00aaff, 0.07, () => {
            const side = Math.random() > 0.5 ? 1 : -1;
            // Esferas nas laterais baixas
            const r = Math.random() * 1.0; 
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            let x = r * Math.sin(phi) * Math.cos(theta);
            let y = r * Math.sin(phi) * Math.sin(theta);
            let z = r * Math.cos(phi);

            x += side * 1.3; // Afastar do centro
            y -= 0.8;        // Baixar
            z += 0.5;        // Para frente

            return {x, y, z};
        });

        // 3. Focinho (Muzzle) - O segredo da definição
        const muzzle = addCluster(1500, 0x00ffff, 0.06, () => {
            // Esfera menor projetada bem à frente
            const r = Math.random() * 0.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            let x = r * Math.sin(phi) * Math.cos(theta);
            let y = r * Math.sin(phi) * Math.sin(theta);
            let z = r * Math.cos(phi);

            x *= 1.2; // Um pouco mais largo
            y -= 0.8; // Altura da boca
            z += 1.8; // PROJETADO PARA FRENTE

            return {x, y, z};
        });

        // 4. Nariz (Triângulo rosa)
        const nose = addCluster(300, 0xff00aa, 0.08, () => {
            // Triângulo invertido
            const w = (Math.random() - 0.5) * 0.4;
            const h = Math.random() * 0.3;
            
            let x = w * (1 - h/0.3); // Afunila em baixo
            let y = -0.5 - h; 
            let z = 2.6; // Ponta mais extrema

            return {x, y, z};
        });

        // 5. Orelhas (Triangulares e Profundas)
        const ears = addCluster(1200, 0xaa00ff, 0.06, () => {
            const side = Math.random() > 0.5 ? 1 : -1;
            
            // Base larga, topo fino
            const h = Math.random(); 
            const w = (1 - h) * 0.8; 
            
            let x = (Math.random() - 0.5) * w * 2;
            let y = h * 1.8; 
            let z = (Math.random() - 0.5) * 0.5;

            // Posicionar
            x += side * 1.2;
            y += 1.2;
            
            // Rotacionar
            const rotZ = -0.3 * side;
            const rx = x * Math.cos(rotZ) - y * Math.sin(rotZ);
            const ry = x * Math.sin(rotZ) + y * Math.cos(rotZ);

            return {x: rx, y: ry, z};
        });

        // 6. Olhos (Definição clara)
        const eyes = addCluster(500, 0xffffff, 0.09, () => {
            const side = Math.random() > 0.5 ? 1 : -1;
            const theta = Math.random() * Math.PI * 2;
            
            // Formato amendoado
            let x = Math.cos(theta) * 0.5; 
            let y = Math.sin(theta) * 0.3; // Mais achatado
            let z = 0;

            // Pupila vertical (espaço vazio no meio)
            if (Math.abs(x) < 0.1) return {x:0, y:0, z:0}; // Pula pontos no centro (pupila)

            // Inclinação "Badass"
            const tilt = -0.3 * side;
            const rx = x * Math.cos(tilt) - y * Math.sin(tilt);
            const ry = x * Math.sin(tilt) + y * Math.cos(tilt);

            // Posição
            x = rx + (side * 0.9);
            y = ry + 0.3;
            z = 2.0; 

            return {x, y, z};
        });

        // --- ANIMAÇÃO ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Movimento suave da cabeça ("Idle")
            catGroup.rotation.y = Math.sin(time * 0.3) * 0.2; // Olha para os lados
            catGroup.rotation.x = Math.sin(time * 0.5) * 0.05; // Leve aceno

            // Animação das partículas (Vida)
            catGroup.children.forEach(mesh => {
                const positions = mesh.geometry.attributes.position.array;
                const basePos = mesh.geometry.attributes.basePos.array;
                
                for(let i=0; i < positions.length; i+=3) {
                    // Respiração/Ruído
                    positions[i]   = basePos[i]   + Math.sin(time * 3 + basePos[i+1]) * 0.01;
                    positions[i+1] = basePos[i+1] + Math.cos(time * 2 + basePos[i]) * 0.01;
                    positions[i+2] = basePos[i+2];

                    // Simulação de fala (apenas no focinho/queixo)
                    if (mesh === muzzle && basePos[i+1] < -1.0) {
                         positions[i+1] += Math.sin(time * 15) * 0.08; 
                    }
                }
                mesh.geometry.attributes.position.needsUpdate = true;
            });

            // Piscar os olhos (escala no Y)
            const blink = Math.sin(time * 0.8);
            if (blink > 0.95) {
                eyes.scale.y = 0.1; // Fecha
            } else {
                eyes.scale.y = 1.0; // Abre
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
