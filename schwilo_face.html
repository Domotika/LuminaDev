<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Schwilo :: Visual Core</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="status">SCHWILO // SYSTEM: ONLINE // R69: WAITING</div>
    <!-- Importando Three.js via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuração da Cena ---
        const scene = new THREE.Scene();
        // Fundo levemente azulado escuro para dar clima cyber
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Criação do Gato de Partículas ---
        // Vamos criar uma geometria customizada baseada numa esfera, mas com deformações
        const particleCount = 4000; // Quantidade de pontos (leve para o R69)
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        const color1 = new THREE.Color(0x00ffff); // Ciano (Tech)
        const color2 = new THREE.Color(0xbd00ff); // Roxo (Mysterious)

        for (let i = 0; i < particleCount; i++) {
            // Coordenadas esféricas
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            let radius = 2;

            // Converter para Cartesiano
            let x = radius * Math.sin(phi) * Math.cos(theta);
            let y = radius * Math.sin(phi) * Math.sin(theta);
            let z = radius * Math.cos(phi);

            // --- A MÁGICA DO GATO (Deformação Matemática) ---
            
            // 1. Orelhas: Se estiver no topo e nas laterais, estica para cima
            // (Lógica simples para puxar vértices para criar triângulos)
            const earThresholdY = 0.5;
            const earThresholdX = 0.8;
            
            if (y > earThresholdY && Math.abs(x) > 0.5) {
                // Distância do centro das "orelhas"
                const earPower = Math.max(0, (y - earThresholdY));
                // Puxa para cima (Y) e um pouco para trás (Z)
                y += earPower * 1.5; 
                x *= 1.1; // Alarga um pouco
            }

            // 2. Queixo: Afinar a parte de baixo para parecer um rosto de gato
            if (y < -0.5) {
                x *= 0.8;
                z *= 0.9;
            }

            // Atribuir posições
            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            // Cores: degradê baseada na altura (Y)
            const mixedColor = color1.clone().lerp(color2, (y + 2) / 5);
            colors[i * 3] = mixedColor.r;
            colors[i * 3 + 1] = mixedColor.g;
            colors[i * 3 + 2] = mixedColor.b;

            // Tamanho aleatório
            sizes[i] = Math.random() * 0.05;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Material das partículas
        const material = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- Animação ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Rotação suave "Idle"
            particles.rotation.y = Math.sin(time * 0.2) * 0.2; // Olha para esquerda/direita devagar
            particles.rotation.x = Math.sin(time * 0.1) * 0.05;

            // Simulação de "Respiração/Processamento" (Spectro Falso por enquanto)
            // Acessa os vértices para fazer eles pulsarem
            const positions = particles.geometry.attributes.position.array;
            
            // Pulso sutil no tamanho geral
            const scalePulse = 1 + Math.sin(time * 2) * 0.02;
            particles.scale.set(scalePulse, scalePulse, scalePulse);

            // Tremor eletrônico aleatório (Glitch effect leve)
            if (Math.random() > 0.98) {
                material.opacity = 0.5 + Math.random() * 0.5;
            } else {
                material.opacity = 0.8;
            }

            renderer.render(scene, camera);
        }

        // Responsividade
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
